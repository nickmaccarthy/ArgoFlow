name: CI and release

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  compatibility:
    name: Compatibility (${{ matrix.argocd }})
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Pinned to the interactive-verification combos documented in the README.
        argocd: ['v2.13.4', 'v3.4.6']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: argoflow

      - name: Install Argo CD ${{ matrix.argocd }}
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argocd -f "https://raw.githubusercontent.com/argoproj/argo-cd/${{ matrix.argocd }}/manifests/install.yaml"
          kubectl -n argocd rollout status deploy/argocd-server --timeout=420s

      - name: Mount the ArgoFlow extension into argocd-server
        run: |
          kubectl -n argocd create configmap argoflow-extension --from-file=extension-argoflow.js=dist/extension-workflows.js
          kubectl -n argocd patch deploy argocd-server --type=strategic --patch-file test/e2e/argocd-server-extension-patch.yaml
          kubectl -n argocd rollout status deploy/argocd-server --timeout=300s
          kubectl -n argocd exec deploy/argocd-server -- ls /tmp/extensions

      - name: Install Argo Workflows v3.7.4 and Argo Events v1.9.11
        run: |
          kubectl create namespace argo --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace argo-events --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -n argo -f "https://raw.githubusercontent.com/argoproj/argo-workflows/v3.7.4/manifests/quick-start-minimal.yaml"
          kubectl apply -n argo-events -f "https://raw.githubusercontent.com/argoproj/argo-events/v1.9.11/manifests/install.yaml"
          kubectl wait --for=condition=Established \
            crd/workflows.argoproj.io \
            crd/workflowtemplates.argoproj.io \
            crd/cronworkflows.argoproj.io \
            crd/eventsources.argoproj.io \
            crd/sensors.argoproj.io \
            crd/eventbuses.argoproj.io \
            --timeout=180s
          kubectl -n argo rollout status deploy/workflow-controller --timeout=300s || true

      - name: Sync the fixture Application at this commit
        env:
          REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          kubectl create namespace argoflow-e2e --dry-run=client -o yaml | kubectl apply -f -
          sed "s/__REVISION__/${REVISION}/" test/e2e/argocd-application.yaml | kubectl apply -f -

      - name: Wait for fixture sync to converge
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            health="$(kubectl -n argocd get application argoflow-e2e -o jsonpath='{.status.health.status}' 2>/dev/null || echo '')"
            sync="$(kubectl -n argocd get application argoflow-e2e -o jsonpath='{.status.sync.status}' 2>/dev/null || echo '')"
            echo "attempt ${attempt}: health=${health} sync=${sync}"
            if [ "${sync}" = "Synced" ] && [ "${health}" = "Healthy" ]; then
              kubectl -n argoflow-e2e get workflows.argoproj.io,workflowtemplates.argoproj.io,cronworkflows.argoproj.io,eventsources.argoproj.io,sensors.argoproj.io,eventbuses.argoproj.io
              exit 0
            fi
            sleep 10
          done
          kubectl -n argocd describe application argoflow-e2e || true
          kubectl -n argoflow-e2e get all || true
          exit 1

      - name: Run UI smoke test
        timeout-minutes: 10
        run: |
          set -euo pipefail
          ARGOCD_PASSWORD="$(kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d)"
          export ARGOCD_PASSWORD
          kubectl -n argocd port-forward svc/argocd-server 8090:443 >artifacts-portforward.log 2>&1 &
          echo $! > portforward.pid
          trap 'kill "$(cat portforward.pid)" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -skf "https://localhost:8090/healthz?full=true" >/dev/null; then break; fi
            sleep 2
          done
          curl -skf "https://localhost:8090/healthz?full=true" >/dev/null
          node scripts/e2e-smoke.mjs

      - name: Collect smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence-${{ matrix.argocd }}
          path: |
            artifacts/
            artifacts-portforward.log

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run package:release
      - run: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
