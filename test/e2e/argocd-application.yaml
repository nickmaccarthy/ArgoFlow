apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argoflow-e2e
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nickmaccarthy/ArgoFlow.git
    targetRevision: __REVISION__
    path: test/e2e/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: argoflow-e2e
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
