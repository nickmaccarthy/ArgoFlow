# The sample Workflow runs as this account; the emissary executor needs it to
# exist in the workflow namespace and to publish WorkflowTaskResults.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argo
  namespace: argoflow-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argoflow-executor
  namespace: argoflow-e2e
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argoflow-executor-binding
  namespace: argoflow-e2e
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argoflow-executor
subjects:
  - kind: ServiceAccount
    name: argo
    namespace: argoflow-e2e
